name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu-latest 已预装 Android SDK
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install SDK platform 37 and build-tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            yes | "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
            # Android 17 (API 37)。若 runner 上的 sdkmanager 版本太旧装不上，
            # 下面会回退到 compileSdk 34 继续构建，保证仍能出包。
            yes | "$SM" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null 2>&1 || true
          fi
          if [ ! -d "$SDK/platforms/android-37" ]; then
            echo "API 37 unavailable on this runner -> falling back to compileSdk 34"
            echo "FALLBACK_SDK=34" >> "$GITHUB_ENV"
          fi
          echo "--- installed platforms ---"
          ls "$SDK/platforms" || true
          echo "--- installed build-tools ---"
          ls "$SDK/build-tools" || true

      # Windows 上提交的 gradlew 没有可执行位，这里补上并用 bash 调用
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 公开仓库不保存签名密钥：从 GitHub Secrets 还原。
      # 未配置时 release 会退回 debug 签名，仍可安装。
      - name: Restore signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            mkdir -p keystore
            echo "$SIGNING_KEY_BASE64" | base64 -d > keystore/mixia-release.jks
            echo "SIGNING_KEY_FILE=keystore/mixia-release.jks" >> "$GITHUB_ENV"
            echo "signing key restored from secrets"
          else
            echo "SIGNING_KEY_BASE64 not set, release will be signed with debug key"
          fi

      - name: Apply SDK fallback (only when API 37 is missing)
        if: env.FALLBACK_SDK == '34'
        run: |
          sed -i 's/compileSdk 37/compileSdk 34/; s/targetSdk 37/targetSdk 34/' app/build.gradle
          grep -n "compileSdk\|targetSdk" app/build.gradle || true

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 收集产物：正式包与调试包分开，避免 Release 里出现两个同版本号的 APK
      - name: Collect artifacts
        run: |
          mkdir -p out/release out/debug
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/release/ \; 2>/dev/null || true
          find app/build/outputs/apk/debug -name '*.apk' -exec cp {} out/debug/ \; 2>/dev/null || true
          echo "== release =="; ls -lh out/release || true
          echo "== debug =="; ls -lh out/debug || true

      - name: Upload debug APK (artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: mixia-debug
          path: out/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release APK (artifact)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mixia-release
          path: out/release/*.apk
          if-no-files-found: error
          retention-days: 90

      # Release 页面只挂正式包：更新器（Obtainium 等）只会看到唯一一个 APK
      - name: Attach release APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/release/*.apk
          generate_release_notes: true
